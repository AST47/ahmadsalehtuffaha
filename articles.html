/* ============================================================
   TOKENS — keep identical to index.html so the site feels unified
   ============================================================ */
:root{
  --cream:#f5f2eb;
  --white:#ffffff;
  --ink:#1a1a18;
  --ink-soft:#5a5a55;
  --ink-ghost:#a0a09a;
  --line:#d8d4cc;
  --accent:#7d0102;
  --accent-wash:rgba(125,1,2,.07);
  --radius:14px;
  --maxw:880px;
}

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--cream);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;}

html[lang="ar"] body{font-family:'Cairo',sans-serif;}
html[lang="en"] body, html[lang="tr"] body{font-family:'Lora',serif;}

a{color:inherit;text-decoration:none;}
img{max-width:100%;display:block;}

.dot-grid{
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(rgba(26,26,24,.09) 1px, transparent 1px);
  background-size:28px 28px;
}

/* ---------- header (identical pattern to index.html) ---------- */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(245,242,235,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.nav-wrap{max-width:var(--maxw);margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
@media(max-width:480px){
  .nav-wrap{flex-direction:column;justify-content:center;gap:12px;}
}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;flex-wrap:wrap;justify-content:center;}
html[lang="en"] .logo, html[lang="tr"] .logo{font-weight:700;}
.logo .mark-img{height:32px;width:auto;display:block;}
.logo .role{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px;color:var(--accent);letter-spacing:.03em;}
.logo .role .dash{width:16px;height:1.5px;background:var(--accent);display:inline-block;flex-shrink:0;}
.lang-switch{display:flex;gap:4px;background:var(--white);border:1px solid var(--line);border-radius:999px;padding:3px;}
.lang-switch button{border:none;background:transparent;cursor:pointer;font-family:'Cairo',sans-serif;font-size:13px;font-weight:600;color:var(--ink-soft);padding:6px 13px;border-radius:999px;transition:background .2s, color .2s;}
.lang-switch button.active{background:var(--ink);color:var(--cream);}
.lang-switch button:hover:not(.active){color:var(--ink);}

/* ---------- page head ---------- */
.page-head{max-width:var(--maxw);margin:0 auto;padding:50px 24px 10px;}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--ink-soft);margin-bottom:22px;}
.back-link:hover{color:var(--accent);}
.back-link svg{width:15px;height:15px;stroke:currentColor;}
html[dir="rtl"] .back-link svg{transform:scaleX(-1);}
.page-title{font-size:clamp(1.7rem,4.4vw,2.5rem);font-weight:800;}
html[lang="en"] .page-title, html[lang="tr"] .page-title{font-weight:700;}

/* ---------- card grid ---------- */
section{max-width:var(--maxw);margin:0 auto;padding:26px 24px 70px;}
.item-grid{display:grid;grid-template-columns:1fr;gap:16px;}
@media(min-width:640px){.item-grid{grid-template-columns:repeat(2,1fr);}}

.item-card{
  position:relative;overflow:hidden;
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
  transition:border-color .3s, transform .2s;
}
.item-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.item-card::before{
  content:'';position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(360px circle at var(--mx,50%) var(--my,50%), var(--accent-wash), transparent 45%);
  transition:opacity .4s;z-index:0;
}
.item-card:hover::before{opacity:1;}
.item-body{padding:22px;position:relative;z-index:1;}
.item-cover{width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--cream);border-bottom:1px solid var(--line);}
.item-cover img{width:100%;height:100%;object-fit:cover;display:block;}
.item-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;position:relative;z-index:1;}
.item-ext{width:14px;height:14px;stroke:var(--ink-ghost);flex-shrink:0;margin-inline-start:auto;transition:stroke .2s;}
.item-card:hover .item-ext{stroke:var(--accent);}
.item-title{font-size:17px;font-weight:800;position:relative;z-index:1;}
html[lang="en"] .item-title, html[lang="tr"] .item-title{font-weight:700;}
.item-date{font-size:12px;color:var(--ink-ghost);font-weight:600;margin-top:12px;display:block;position:relative;z-index:1;}
.item-blurb{font-size:14px;color:var(--ink-soft);position:relative;z-index:1;}

.empty-state{
  grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--ink-ghost);font-size:15px;
  border:1px dashed var(--line);border-radius:var(--radius);
}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);padding:34px 24px;max-width:var(--maxw);margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;}
@media(max-width:480px){
  footer{grid-template-columns:1fr;gap:18px;}
  .foot-copy{justify-self:center !important;text-align:center;}
  .footer-logo{justify-self:center;}
  .foot-socials{justify-self:center !important;}

.footer-logo img{height:72px;width:auto;display:block;}

.foot-socials{display:flex;gap:10px;justify-self:end;}
.social-btn{width:44px;height:44px;border-radius:10px;background:var(--white);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);transition:border-color .2s, color .2s;}
.social-btn:hover{border-color:var(--accent);color:var(--accent);}
.social-btn svg{width:20px;height:20px;}
</style>

function applyTranslations(lang){
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === "ar") ? "rtl" : "ltr";
  const dict = translations[lang];
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.getAttribute("data-i18n");
    if(dict[key]) el.textContent = dict[key];
  });
  document.querySelectorAll(".lang-switch button").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.lang === lang);
  });
}

function formatDate(code, lang){
  // Expects a 6-digit YYMMDD code (e.g. "260827"). Anything else is shown as-is.
  if(!/^\d{6}$/.test(String(code))) return code || "";
  const yy = code.slice(0,2), mm = parseInt(code.slice(2,4),10)-1, dd = parseInt(code.slice(4,6),10);
  const year = 2000 + parseInt(yy,10);
  const months = {
    ar: ["كانون الثاني","شباط","آذار","نيسان","أيار","حزيران","تموز","آب","أيلول","تشرين الأول","تشرين الثاني","كانون الأول"],
    en: ["January","February","March","April","May","June","July","August","September","October","November","December"],
    tr: ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"]
  };
  const monthName = (months[lang] || months.en)[mm];
  if(lang === "en") return `${monthName} ${dd}, ${year}`;
  return `${dd} ${monthName} ${year}`;
}

function renderItems(lang){
  const grid = document.getElementById("item-grid");
  grid.innerHTML = "";
  if(ITEMS.length === 0){
    const p = document.createElement("p");
    p.className = "empty-state";
    p.textContent = translations[lang]["empty"];
    grid.appendChild(p);
    return;
  }
  ITEMS.forEach(item=>{
    const a = document.createElement("a");
    a.href = item.url; a.target = "_blank"; a.rel = "noopener";
    a.className = "item-card";
    const cover = item.image
      ? `<div class="item-cover"><img src="${item.image}" alt="" loading="lazy"></div>`
      : "";
    a.innerHTML = `
      ${cover}
      <div class="item-body">
        <div class="item-top">
          <span class="item-title">${item.title[lang] || item.title.ar}</span>
          <svg class="item-ext" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>
        </div>
        <p class="item-blurb">${(item.blurb && (item.blurb[lang] || item.blurb.ar)) || ""}</p>
        <span class="item-date">${formatDate(item.date, lang)}</span>
      </div>`;
    a.addEventListener("mousemove", e=>{
      const r = a.getBoundingClientRect();
      a.style.setProperty("--mx", (e.clientX - r.left) + "px");
      a.style.setProperty("--my", (e.clientY - r.top) + "px");
    });
    grid.appendChild(a);
  });
}

function setLanguage(lang){
  localStorage.setItem("site-lang", lang);
  applyTranslations(lang);
  renderItems(lang);
}

document.querySelectorAll(".lang-switch button").forEach(btn=>{
  btn.addEventListener("click", ()=> setLanguage(btn.dataset.lang));
});

function detectLang(){
  const saved = localStorage.getItem("site-lang");
  if(translations[saved]) return saved;
  const nav = (navigator.language || navigator.userLanguage || "").toLowerCase();
  if(nav.startsWith("ar")) return "ar";
  if(nav.startsWith("tr")) return "tr";
  if(nav.startsWith("en")) return "en";
  return "ar";
}
setLanguage(detectLang());
